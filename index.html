<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bản đồ Người có công với Cách mạng - Xã Hàm Yên</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23B91C1C' stroke='%23D4AF37' stroke-width='3'/><circle cx='50' cy='50' r='37' fill='%23991B1B' stroke='%23FBBF24' stroke-width='1' stroke-dasharray='4,2'/><path d='M 22,50 C 22,65 35,78 50,78 C 65,78 78,65 78,50' fill='none' stroke='%23FBBF24' stroke-width='2.5' stroke-linecap='round'/><path d='M 22,50 L 20,48 M 26,58 L 23,55 M 32,66 L 29,62 M 41,73 L 38,69 M 50,75 L 50,71 M 59,73 L 62,69 M 68,66 L 71,62 M 74,58 L 77,55 M 78,50 L 80,48' stroke='%23FBBF24' stroke-width='2' stroke-linecap='round'/><polygon points='50,22 58,38 76,41 63,54 66,72 50,64 34,72 37,54 24,41 42,38' fill='%23FBBF24' stroke='%23F59E0B' stroke-width='1'/></svg>" />
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Defensive fetch patch failed:", e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
